<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  :root{--primary:#2563eb;--primary-dark:#1d4ed8;--dark:#111827;--text:#172033;--muted:#64748b;--panel:#ffffff;--panel-soft:#f8fafc;--border:#e2e8f0;--success:#16a34a;--danger:#dc2626;--warning:#d97706;--info:#0284c7;--brand:#1a8f3f;--brand-dark:#146b30;--brand-light:#eafbf0}
  html{scroll-behavior:smooth}body{background:#f3f6fa;color:var(--text);min-height:100vh}
  button,input,select,textarea{font:inherit}
  h1,h2,h3,.login-box h1,.sidebar-header h2{font-family:'Poppins','Segoe UI',system-ui,sans-serif}
  #loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 10%,#eafbf0 0%,rgba(234,251,240,0) 45%),radial-gradient(circle at 85% 90%,#eef4ff 0%,rgba(238,244,255,0) 45%),#f8fafc}
  .login-box{background:#fff;border:1px solid var(--border);padding:40px 38px 34px;border-radius:22px;box-shadow:0 24px 70px rgba(15,23,42,.14);width:420px;max-width:100%;text-align:center}
  .login-logo{width:72px;height:72px;border-radius:18px;margin:0 auto 16px;display:block;box-shadow:0 10px 24px rgba(26,143,63,.28)}
  .login-box h1{color:#172033;margin-bottom:4px;font-size:26px;font-weight:700;letter-spacing:-.01em}
  .login-box p{color:var(--muted);margin-bottom:26px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .login-box .form-group{text-align:left}
  .form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:7px;font-size:13px;font-weight:600;color:#334155}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 13px;border:1px solid #d7dee8;background:#fff;color:#172033;border-radius:10px;font-size:14px;transition:.2s}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .btn{padding:10px 16px;border:1px solid transparent;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px)}.btn-primary{background:#2563eb;color:#fff;box-shadow:0 6px 15px rgba(37,99,235,.18)}
  .btn-danger{background:#dc2626;color:#fff}.btn-success{background:#16a34a;color:#fff}.btn-info{background:#0284c7;color:#fff}.btn-warning{background:#d97706;color:#fff}.btn-sm{padding:7px 10px;font-size:12px}.btn-block{width:100%}
  .error-msg{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px;border-radius:9px;font-size:13px;margin-bottom:12px;display:none}
  #appPage{display:none;min-height:100vh}.app-container{display:flex;min-height:100vh}
  .sidebar{width:250px;background:#fff;border-right:1px solid var(--border);color:#172033;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;box-shadow:4px 0 18px rgba(15,23,42,.04)}
  .sidebar-header{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
  .sidebar-header img{width:40px;height:40px;border-radius:10px;flex:0 0 auto;box-shadow:0 4px 10px rgba(26,143,63,.22)}
  .sidebar-header .brand-text{min-width:0}
  .sidebar-header h2{font-size:16px;color:#172033;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidebar-header small{color:#94a3b8;font-size:10.5px;letter-spacing:.02em}
  .sidebar-nav{padding:14px 10px;flex:1}.nav-item{padding:12px 14px;margin:4px 0;cursor:pointer;font-size:14px;color:#64748b;transition:.2s;border:1px solid transparent;border-radius:10px}
  .nav-item:hover{background:#f1f5f9;color:#1e3a8a;border-color:#e2e8f0}.nav-item.active{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
  .sidebar-footer{padding:16px;border-top:1px solid var(--border);font-size:12px}.sidebar-footer .user-info{color:#64748b;margin-bottom:10px}
  .main-content{flex:1;margin-left:250px;padding:28px;min-height:100vh;max-width:1700px}
  .page-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:15px;border-bottom:1px solid var(--border)}
  .page-header h1{font-size:26px;color:#172033}.page-header .role-badge{background:#eff6ff;color:#1d4ed8;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
  .stat-card,.card{background:#fff;border:1px solid var(--border);box-shadow:0 8px 24px rgba(15,23,42,.05);transition:box-shadow .2s,transform .2s}
  .stat-card{padding:20px;border-radius:15px;border-left:4px solid var(--primary)}
  .stat-card:hover{box-shadow:0 14px 32px rgba(15,23,42,.09);transform:translateY(-2px)}
  .stat-card h3{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;font-weight:700}.stat-card .value{font-size:25px;font-weight:800;color:#172033;font-family:'Poppins','Segoe UI',sans-serif}
  .stat-card.green{border-left-color:var(--success)}.stat-card.red{border-left-color:var(--danger)}.stat-card.blue{border-left-color:var(--info)}
  .card{border-radius:15px;padding:20px;margin-bottom:20px}.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.card-header h2{font-size:18px;color:#172033}
  .card-header select,.card-header input{background:#fff;color:#172033;border:1px solid var(--border);border-radius:9px;padding:9px}
  .table-wrap{width:100%;overflow-x:auto;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #e8edf3}th{background:#f8fafc;color:#64748b;font-weight:700;font-size:11px;text-transform:uppercase}td{color:#334155}tr:hover{background:#f8fbff}.empty-state{text-align:center;padding:48px 20px;color:#94a3b8;font-size:13.5px}.empty-state::before{content:'';display:block;width:46px;height:46px;margin:0 auto 12px;border-radius:12px;background:var(--brand-light)}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;z-index:1000;overflow-y:auto;padding:18px;backdrop-filter:blur(3px)}.modal-overlay.active{display:flex}
  .modal{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;width:620px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 70px rgba(15,23,42,.2)}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:13px;border-bottom:1px solid var(--border)}.modal-header h2{font-size:19px}.modal-close{background:none;border:0;font-size:26px;cursor:pointer;color:#64748b}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .badge{padding:4px 9px;border-radius:12px;font-size:11px;font-weight:700}.badge-paid,.badge-successful,.badge-delivered,.badge-active{background:#dcfce7;color:#166534}.badge-pending,.badge-processing{background:#fef3c7;color:#92400e}.badge-partial,.badge-shipped,.badge-unpaid{background:#dbeafe;color:#1e40af}.badge-failed,.badge-cancelled,.badge-inactive{background:#fee2e2;color:#991b1b}
  .hidden{display:none!important}.text-right{text-align:right}.mt-2{margin-top:8px}.actions-cell{display:flex;gap:5px;flex-wrap:wrap}
  #toastContainer{position:fixed;right:22px;bottom:22px;z-index:3000;display:flex;flex-direction:column;gap:10px;pointer-events:none}.toast{min-width:280px;max-width:420px;padding:13px 16px;border:1px solid #dbe4ef;border-radius:12px;background:#fff;color:#172033;box-shadow:0 14px 35px rgba(15,23,42,.15);display:flex;align-items:center;gap:10px;animation:toastIn .25s ease}.toast.success{border-color:#86efac}.toast.error{border-color:#fca5a5}.toast.warning{border-color:#fcd34d}.toast-dot{width:9px;height:9px;border-radius:50%;background:#38bdf8;flex:0 0 auto}.toast.success .toast-dot{background:#22c55e}.toast.error .toast-dot{background:#ef4444}.toast.warning .toast-dot{background:#f59e0b}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* Navigation visibility fix */
  #appPage .sidebar{visibility:visible!important;opacity:1!important}
  #appPage .sidebar-nav{visibility:visible!important;opacity:1!important}
  #appPage .nav-item{visibility:visible!important;opacity:1!important}

  /* ===== MOBILE-FIRST RESPONSIVE UI ===== */
  @media(max-width:1100px) and (min-width:701px){
    .sidebar{width:82px}
    .sidebar-header h2,.sidebar-header small,.sidebar-footer{display:none}
    .sidebar-nav{padding:14px 8px}
    .nav-item{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 5px;font-size:14px}
    .nav-item .nav-icon{font-size:21px;display:block}
    .nav-item .nav-label{display:none}
    .main-content{margin-left:82px;padding:22px}
    .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  @media(max-width:700px){
    html,body{width:100%;overflow-x:hidden}
    #loginPage{min-height:100dvh;padding:16px}
    .login-box{width:100%;padding:24px 18px;border-radius:16px}
    .login-box h1{font-size:25px}
    .form-group{margin-bottom:14px}
    .form-group input,.form-group select,.form-group textarea{min-height:46px;font-size:16px}
    .btn{min-height:44px}

    .app-container{display:block;min-height:100dvh}
    .main-content{
      margin-left:0;
      width:100%;
      min-height:calc(100dvh - 68px);
      padding:14px 12px 88px;
      max-width:none;
    }

    /* Mobile bottom navigation */
    .sidebar{
      position:fixed;
      left:0;right:0;bottom:0;top:auto;
      width:100%;
      height:68px;
      display:block;
      border:0;
      border-top:1px solid #dbe3ed;
      border-radius:0;
      background:rgba(255,255,255,.97);
      box-shadow:0 -8px 24px rgba(15,23,42,.10);
      z-index:2000;
      backdrop-filter:blur(10px);
    }
    .sidebar-header,.sidebar-footer{display:none}
    .sidebar-nav{
      width:100%;
      height:100%;
      padding:5px 4px;
      display:flex;
      align-items:stretch;
      gap:2px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .sidebar-nav::-webkit-scrollbar{display:none}
    .nav-item{
      flex:1 0 66px;
      min-width:66px;
      margin:0;
      padding:6px 3px 5px;
      border:0!important;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#64748b;
      font-size:20px;
      line-height:1;
    }
    .nav-item span{
      display:flex!important;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      max-width:72px;
      overflow:hidden;
      white-space:nowrap;
    }
    .nav-item .nav-icon{font-size:20px;line-height:20px;display:block}
    .nav-item .nav-label{display:block;font-size:9px;line-height:12px;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis}
    .nav-item.active .nav-label{color:#2563eb}
    .nav-item.active{background:#eff6ff;color:#2563eb}
    .nav-item:hover{background:#f8fafc}

    .page-header{
      position:sticky;
      top:0;
      z-index:50;
      margin:0 -12px 14px;
      padding:12px 12px 11px;
      background:rgba(243,246,250,.96);
      border-bottom:1px solid #e2e8f0;
      backdrop-filter:blur(8px);
    }
    .page-header h1{font-size:20px;line-height:1.2}
    .page-header .role-badge{font-size:10px;padding:4px 9px}
    .page-logout-btn{min-height:38px;padding:7px 10px;font-size:11px}

    .cards-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
      margin-bottom:14px
    }
    .stat-card{
      min-width:0;
      padding:13px 12px;
      border-radius:12px;
    }
    .stat-card h3{
      font-size:9px;
      line-height:1.25;
      margin-bottom:6px
    }
    .stat-card .value{
      font-size:17px;
      line-height:1.25;
      word-break:break-word
    }

    .card{
      padding:13px;
      border-radius:13px;
      margin-bottom:13px;
      overflow:hidden
    }
    .card-header{
      align-items:flex-start;
      margin-bottom:12px;
    }
    .card-header h2{font-size:16px}
    .card-header select,.card-header input{
      width:auto;
      max-width:48%;
      min-height:40px;
      font-size:14px
    }

    /* Tables become card-like rows instead of forcing desktop width */
    .table-wrap{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      margin:0 -2px
    }
    table{
      min-width:650px;
      font-size:12px
    }
    th,td{padding:9px 8px;white-space:nowrap}

    .actions-cell{gap:4px}
    .actions-cell .btn{min-height:36px;padding:6px 8px;font-size:11px}

    .form-row{grid-template-columns:1fr;gap:0}
    .modal-overlay{
      align-items:flex-end;
      padding:0;
    }
    .modal{
      width:100%;
      max-width:100%;
      max-height:92dvh;
      padding:18px 15px 16px;
      border-radius:20px 20px 0 0;
      border-bottom:0;
      animation:modalUp .2s ease
    }
    .modal-header h2{font-size:18px}
    .modal-footer{
      flex-direction:column-reverse;
      gap:8px;
      padding-bottom:max(4px,env(safe-area-inset-bottom))
    }
    .modal-footer .btn{width:100%;min-height:46px}

    #toastContainer{
      left:10px;
      right:10px;
      bottom:78px;
      gap:7px;
    }
    .toast{
      width:100%;
      min-width:0;
      max-width:none;
      padding:12px 13px;
      font-size:13px;
      border-radius:11px
    }

    canvas{max-width:100%!important}
  }

  @media(max-width:390px){
    .main-content{padding-left:9px;padding-right:9px}
    .page-header{margin-left:-9px;margin-right:-9px;padding-left:9px;padding-right:9px}
    .cards-grid{gap:7px}
    .stat-card{padding:11px 9px}
    .stat-card .value{font-size:15px}
    .nav-item{min-width:58px}
  }

  @media(min-width:701px) and (max-width:1100px){
    .main-content{margin-left:82px}
  }

  @keyframes modalUp{
    from{transform:translateY(40px);opacity:.7}
    to{transform:translateY(0);opacity:1}
  }
</style>

function showToast(message,type='success',duration=2800){
  const box=document.getElementById('toastContainer'); if(!box)return;
  const t=document.createElement('div'); t.className='toast '+type;
  const dot=document.createElement('span'); dot.className='toast-dot';
  const msg=document.createElement('span'); msg.textContent=message;
  t.append(dot,msg); box.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(8px)';setTimeout(()=>t.remove(),220)},duration);
}

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWNFy1hyGxtJNdmgOhx1Mz9jQU3d342UQHZRX3Isa_Qo8KXRO8YpNBqxsfS-LwHqAE/exec';
let googleReady = false;

async function apiPost(action, data = {}) {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('PASTE_YOUR')) {
    throw new Error('Google Apps Script URL is not configured.');
  }
  const payload = JSON.stringify({ action, ...data });
  let lastError = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload,
        cache: 'no-store'
      });
      return true;
    } catch (e) {
      lastError = e;
      await new Promise(r => setTimeout(r, 500 * attempt));
    }
  }
  throw lastError || new Error('Google Sheets request failed.');
}

async function saveToGoogle(action, record) {
  try {
    await apiPost(action, record);
    googleReady = true;
    const st = document.getElementById('googleStatus');
    if (st) { st.textContent = '✓ Google Sheets connected'; st.style.color = '#059669'; }
    return true;
  } catch (e) {
    googleReady = false;
    console.error('Google save failed:', action, e);
    alert('Local save completed, but Google Sheet save failed.\n\nCheck the Apps Script deployment URL and SPREADSHEET_ID.');
    return false;
  }
}

function apiGet(action) {
  return new Promise(async (resolve, reject) => {
    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('PASTE_YOUR')) {
      reject(new Error('Google Apps Script URL is not configured.'));
      return;
    }

    try {
      const url =
        GOOGLE_SCRIPT_URL +
        '?action=' + encodeURIComponent(action) +
        '&_=' + Date.now();

      const response = await fetch(url, {
        method: 'GET',
        cache: 'no-store',
        redirect: 'follow'
      });

      if (!response.ok) {
        throw new Error(
          'Google Apps Script returned HTTP ' + response.status
        );
      }

      const result = await response.json();

      if (!result || result.success !== true) {
        throw new Error(
          result?.message || 'Google Apps Script request failed.'
        );
      }

      resolve(result.data);
    } catch (error) {
      console.error('Google GET error:', error);
      reject(error);
    }
  });
}

async function loadFromGoogleSheets(showError = false) {

    googleReady = false;
    const st = document.getElementById('googleStatus');
    if (st) { st.textContent = '⚠ Google Sheets connection unavailable'; st.style.color = '#dc2626'; }
    if (showError) alert('Google Sheet connection failed:\n' + e.message);
    console.error(e);
    return false;
  }
}

const SHA256_REGEX = /^[a-f0-9]{64}$/i;

async function sha256Hex(value) {
  const data = new TextEncoder().encode(String(value ?? ''));
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

function isPasswordHash(value) {
  return SHA256_REGEX.test(String(value || '').trim());
}

async function migrateLocalPlainPasswords() {
  const users = DB.get('users');
  let changed = false;
  for (const user of users) {
    if (!isPasswordHash(user.password_hash) && user.password) {
      user.password_hash = await sha256Hex(user.password);
      delete user.password;
      changed = true;
    }
  }
  if (changed) DB.set('users', users);
}

let currentUser = null;

async function logUserActivity({user = null, username = '', action = 'LOGIN', status = 'SUCCESS', message = ''} = {}) {
  const cleanAction = String(action || 'LOGIN').toUpperCase();
  const cleanStatus = String(status || 'SUCCESS').toUpperCase();
  const now = new Date().toISOString();
  const payload = {
    action: 'addLoginLog',
    user_id: user?.user_id ?? '',
    username: username || user?.username || '',
    full_name: user?.full_name || '',
    role: user?.role || '',
    login_time: now,
    log_action: cleanAction,
    status: cleanStatus,
    message: message || ''
  };

  // Keep the UI log immediately updated as well as saving to Google Sheets.
  const localLog = {
    log_id: 'local-' + Date.now(),
    user_id: payload.user_id,
    username: payload.username,
    full_name: payload.full_name,
    role: payload.role,
    login_time: now,
    action: cleanAction,
    status: cleanStatus,
    message: payload.message
  };
  const logs = DB.get('login_logs');
  logs.push(localLog);
  DB.set('login_logs', logs.slice(-500));

  try {
    await apiPost('addLoginLog', payload);
    return true;
  } catch (e) {
    console.warn('Login activity log failed:', e);
    return false;
  }
}

async function handleLogin() {
  const usernameEl = document.getElementById('loginUsername');
  const passwordEl = document.getElementById('loginPassword');
  const btn = document.querySelector('#loginPage button[onclick="handleLogin()"]');
  const username = String(usernameEl?.value || '').trim();
  const password = String(passwordEl?.value || '');
  const errBox = document.getElementById('loginError');

  errBox.style.display = 'none';
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }

  try {
    if (!username || !password) {
      errBox.textContent = 'Please enter username and password.';
      errBox.style.display = 'block';
      await logUserActivity({ username, action: 'LOGIN', status: 'FAILED', message: 'Missing username or password' });
      return;
    }

    const loaded = await loadFromGoogleSheets(false);
    if (!loaded) {
      errBox.textContent = 'Cannot connect to Google Sheets. Please try again.';
      errBox.style.display = 'block';
      await logUserActivity({ username, action: 'LOGIN', status: 'FAILED', message: 'Google Sheets connection failed' });
      return;
    }

    const users = DB.get('users') || [];
    const passwordHash = await sha256Hex(password);

    // Supports the current password_hash column and older password/PasswordHash data.
    const user = users.find(u => {
      const storedUsername = String(
        u.username ?? u.Username ?? u.user_name ?? ''
      ).trim().toLowerCase();
      if (storedUsername !== username.toLowerCase()) return false;

      const storedHash = String(
        u.password_hash ?? u.PasswordHash ?? u.passwordHash ?? ''
      ).trim().toLowerCase();
      const plainPassword = String(u.password ?? u.Password ?? '').trim();

      return storedHash === passwordHash.toLowerCase() ||
             (plainPassword !== '' && plainPassword === password);
    });

    if (!user) {
      errBox.textContent = 'Invalid credentials. Please try again.';
      errBox.style.display = 'block';
      await logUserActivity({ username, action: 'LOGIN', status: 'FAILED', message: 'Invalid username or password' });
      return;
    }

    const normalizedUser = {
      user_id: user.user_id ?? user.UserID ?? user.id ?? '',
      full_name: user.full_name ?? user.FullName ?? user.name ?? username,
      username: user.username ?? user.Username ?? username,
      role: String(user.role ?? user.Role ?? 'Staff'),
      email: user.email ?? user.Email ?? '',
      contact: user.contact ?? user.Contact ?? '',
      status: String(user.status ?? user.Status ?? 'Active')
    };

    if (normalizedUser.status.toLowerCase() !== 'active') {
      errBox.textContent = 'Account is inactive. Contact admin.';
      errBox.style.display = 'block';
      await logUserActivity({ user: normalizedUser, action: 'LOGIN', status: 'FAILED', message: 'Account is inactive' });
      return;
    }

    currentUser = normalizedUser;

    await logUserActivity({
      user: currentUser,
      action: 'LOGIN',
      status: 'SUCCESS',
      message: 'User logged in successfully'
    });

    errBox.style.display = 'none';
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    renderSidebar();
    navigate(currentUser.role.toLowerCase() === 'admin' ? 'dashboard' : 'sales');
    showToast('Login successful. Welcome, ' + currentUser.full_name + '!', 'success');
  } catch (e) {
    console.error('Login error:', e);
    errBox.textContent = 'Login failed. Please check the Google Sheets connection and try again.';
    errBox.style.display = 'block';
    await logUserActivity({ username, action: 'LOGIN', status: 'FAILED', message: 'Unexpected login error' });
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Login'; }
  }
}

async function handleLogout() {
  const user = currentUser;
  if (!user) return;

  // Log logout before clearing the session.
  await logUserActivity({
    user,
    action: 'LOGOUT',
    status: 'SUCCESS',
    message: 'User logged out successfully'
  });

  currentUser = null;
  localStorage.removeItem('seeman_current_user');

  document.getElementById('appPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginUsername').focus();

function monthlySeries(month, year) {
  const sales = DB.get('sales').filter(s => {
    const d = new Date(s.sale_date);
    return d.getMonth() + 1 === month && d.getFullYear() === year;
  });
  const costs = DB.get('costs').filter(c => {
    const d = new Date(c.cost_date);
    return d.getMonth() + 1 === month && d.getFullYear() === year;
  });

  const days = new Date(year, month, 0).getDate();
  const labels = Array.from({length: days}, (_, i) => String(i + 1).padStart(2, '0'));
  const income = labels.map(day => sales.filter(s => String(new Date(s.sale_date).getDate()).padStart(2,'0') === day)
    .reduce((n,s) => n + (Number(s.total_amount)||0), 0));
  const cost = labels.map(day => costs.filter(c => String(new Date(c.cost_date).getDate()).padStart(2,'0') === day)
    .reduce((n,c) => n + (Number(c.total_price)||0), 0));
  return {labels, income, cost};
}

function updateSaleCalc() {
  const sel = document.getElementById('saleProduct');
  const opt = sel.options[sel.selectedIndex];
  const price = parseFloat(document.getElementById('saleUnitPrice')?.value || 0);

  const qty = parseFloat(document.getElementById('saleQty').value) || 0;
  const rate = parseFloat(document.getElementById('saleServiceRate').value) || 0;
  const commission = parseFloat(document.getElementById('saleCommission').value) || 0;

  const subtotal = qty * price;
  const service = subtotal * (rate / 100);
  // Per requirements doc: Total = Subtotal - (Service + Commission)
  const total = subtotal - (service + commission);

  document.getElementById('calcSubtotal').textContent = 'Rs. ' + subtotal.toLocaleString();
  document.getElementById('calcService').textContent = 'Rs. ' + service.toFixed(2);
  document.getElementById('calcCommission').textContent = 'Rs. ' + commission.toFixed(2);
  document.getElementById('calcTotal').textContent = 'Rs. ' + total.toFixed(2);
}

async function saveSale(id) {
  const customerId = parseInt(document.getElementById('saleCustomer').value);
  const productId = parseInt(document.getElementById('saleProduct').value);
  const qty = parseFloat(document.getElementById('saleQty').value);
  const unitPrice = parseFloat(document.getElementById('saleUnitPrice').value);
  const rate = parseFloat(document.getElementById('saleServiceRate').value) || 0;
  const commission = parseFloat(document.getElementById('saleCommission').value) || 0;
  const date = document.getElementById('saleDate').value;
  if (!customerId || !productId || !qty || qty <= 0 || !Number.isFinite(unitPrice) || unitPrice < 0) {
    actionError('Please fill all required fields correctly.'); return;
  }
  const sales = DB.get('sales');
  const subtotal = qty * unitPrice;
  const service = subtotal * rate / 100;
  const total = subtotal - service - commission;
  let record;
  if (id) {
    const idx = sales.findIndex(s => s.sales_id === id);
    if (idx < 0) { alert('Sale not found'); return; }
    record = { ...sales[idx], customer_id: customerId, product_id: productId, quantity: qty, unit_price: unitPrice, service_charge_rate: rate, commission_amount: commission, subtotal, service_charge_amount: service, total_amount: total, sale_date: date };
    sales[idx] = record;
  } else {
    record = { sales_id: sales.length ? Math.max(...sales.map(s => Number(s.sales_id)||0)) + 1 : 1, sales_code: DB.nextId('sales', 'SAL'), customer_id: customerId, product_id: productId, quantity: qty, unit_price: unitPrice, service_charge_rate: rate, commission_amount: commission, subtotal, service_charge_amount: service, total_amount: total, payment_status: 'Pending', sale_date: date, created_by: currentUser.user_id };
    sales.push(record);
  }
  DB.set('sales', sales);
  await saveToGoogle(id ? 'updateSale' : 'addSale', { ...record });
  if (googleReady) await loadFromGoogleSheets(false);
  closeModal(); renderSales(); actionSuccess(id ? 'Sale updated successfully.' : 'Sale saved successfully.');
}

async function saveUser(id) {
  const fullName = document.getElementById('userFullName').value.trim();
  const username = document.getElementById('userUsername').value.trim();
  const password = document.getElementById('userPassword').value;
  const users = DB.get('users');

  if (!fullName || !username) { alert('Fill required fields'); return; }
  if (!id && !password) { alert('Password required for new user'); return; }

  if (!id && users.find(u => u.username === username)) {
    alert('Username already exists'); return;
  }

  const data = {
    full_name: fullName, username,
    role: document.getElementById('userRole').value,
    status: document.getElementById('userStatus').value,
    email: document.getElementById('userEmail').value,
    contact: document.getElementById('userContact').value
  };
  if (password) {
    data.password_hash = await sha256Hex(password);
  }

  if (id) {
    const idx = users.findIndex(u => u.user_id === id);
    if (idx < 0) { alert('User not found'); return; }
    users[idx] = { ...users[idx], ...data };
    delete users[idx].password;
  } else {
    if (!data.password_hash) { alert('Password hashing failed. Please try again.'); return; }
    users.push({
      user_id: users.length ? Math.max(...users.map(u => u.user_id)) + 1 : 1,
      ...data
    });
  }
  DB.set('users', users);
  const action = id ? 'updateUser' : 'addUser';
  await saveToGoogle(action, users.find(u => u.user_id === (id || users[users.length-1].user_id)));
  if (googleReady) await loadFromGoogleSheets(false);
  closeModal(); renderUsers();
}

      <div class="table-wrap"><table>
        <thead><tr>
          <th>Log ID</th><th>Date & Time</th><th>Username</th><th>Full Name</th>

        </tr></thead>
        <tbody>
          ${logs.map(l => {
            const status = String(l.status || '').toUpperCase();
            const action = String(l.action || '').toUpperCase();
            const badge = status === 'SUCCESS' ? 'successful' : 'failed';
            return `<tr>
              <td>LOG-${String(l.log_id || '').padStart(6,'0')}</td>
              <td>${formatDateTime(l.login_time)}</td>
              <td><b>${escapeHtml(l.username || '-')}</b></td>
              <td>${escapeHtml(l.full_name || '-')}</td>
              <td>${escapeHtml(l.role || '-')}</td>
              <td>${escapeHtml(action || '-')}</td>
              <td><span class="badge badge-${badge}">${escapeHtml(status || '-')}</span></td>
              <td>${escapeHtml(l.message || '-')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>`}
    </div>`;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function formatDateTime(value) {
  if (!value) return '-';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString('en-LK', { dateStyle:'medium', timeStyle:'short' });
}

async function savePayment() {
  const cid = parseInt(document.getElementById('payCustomer').value);
  const sid = parseInt(document.getElementById('paySales').value);
  const amount = parseFloat(document.getElementById('payAmount').value);
  if (!cid || !sid || !amount || amount <= 0) { alert('Fill required fields'); return; }
  const payments = DB.get('payments');
  const record = {
    payment_id: payments.length ? Math.max(...payments.map(p => Number(p.payment_id)||0)) + 1 : 1,
    payment_code: DB.nextId('payments', 'PAY'), customer_id: cid, sales_id: sid,
    payment_date: document.getElementById('payDate').value, payment_amount: amount,
    payment_method: document.getElementById('payMethod').value,
    transaction_ref: document.getElementById('payRef').value.trim(),
    payment_status: document.getElementById('payStatus').value, created_by: currentUser.user_id
  };
  payments.push(record); DB.set('payments', payments);
  await saveToGoogle('addPayment', record);
  if (record.payment_status === 'Successful') {
    updateSaleStatus(sid);
    const updatedSale = DB.get('sales').find(s => Number(s.sales_id) === Number(sid));
    if (updatedSale) await saveToGoogle('updateSale', updatedSale);
  }
  if (googleReady) await loadFromGoogleSheets(false);
  closeModal(); renderPayments();
  alert('Payment saved successfully.');
}

function updateSaleStatus(salesId) {
  const sales = DB.get('sales');
  const sale = sales.find(s => s.sales_id === salesId);
  const paid = DB.get('payments')
    .filter(p => p.sales_id === salesId && p.payment_status === 'Successful')
    .reduce((sum, p) => sum + p.payment_amount, 0);

  let status = 'Pending';
  if (paid >= sale.total_amount) status = 'Paid';
  else if (paid > 0) status = 'Partial';

  const idx = sales.findIndex(s => s.sales_id === salesId);
  sales[idx].payment_status = status;
  DB.set('sales', sales);
}

async function createReceiptFromPayment(paymentId) {
  const payments = DB.get('payments');
  const p = payments.find(x => Number(x.payment_id) === Number(paymentId));
  if (!p) { alert('Payment not found.'); return; }
  if (p.payment_status !== 'Successful') { alert('Receipt can only be generated for a successful payment.'); return; }
  const existing = DB.get('receipts').find(r => Number(r.payment_id) === Number(paymentId));
  if (existing) { alert(`Receipt already exists: ${existing.receipt_code}`); return; }
  const sales = DB.get('sales');
  const sale = sales.find(s => Number(s.sales_id) === Number(p.sales_id));
  if (!sale) { alert('Related sale not found.'); return; }
  const paid = payments.filter(x => Number(x.sales_id) === Number(p.sales_id) && x.payment_status === 'Successful').reduce((sum,x)=>sum+Number(x.payment_amount||0),0);
  const saleTotal = Number(sale.total_amount||0);
  const balance = Math.max(0, saleTotal-paid);
  const paymentAmount = Number(p.payment_amount||0);
  if (paymentAmount <= 0) { alert('Invalid payment amount.'); return; }
  const receipts = DB.get('receipts');
  const receipt = {
    receipt_id: receipts.length ? Math.max(...receipts.map(r=>Number(r.receipt_id)||0))+1 : 1,
    receipt_code: DB.nextId('receipts','RCP'), payment_id:Number(p.payment_id), sales_id:Number(p.sales_id),
    customer_id:Number(p.customer_id), amount_paid:paymentAmount, total_sale_amount:saleTotal, total_paid:paid,
    balance_due:balance, payment_method:p.payment_method||'', payment_date:p.payment_date||new Date().toISOString().slice(0,10),
    issued_by:currentUser.user_id, issued_at:new Date().toISOString(), status:balance<=0?'Paid':'Partial'
  };
  receipts.push(receipt); DB.set('receipts',receipts);
  const idx=sales.findIndex(s=>Number(s.sales_id)===Number(p.sales_id));
  if(idx>=0){sales[idx].payment_status=paid>=saleTotal?'Paid':paid>0?'Partial':'Pending';DB.set('sales',sales);}
  await saveToGoogle('addReceipt', receipt);
  if (idx >= 0) await saveToGoogle('updateSale', {...sales[idx]});
  if (googleReady) await loadFromGoogleSheets(false);
  alert(`Receipt generated successfully!\n\nReceipt: ${receipt.receipt_code}\nAmount Paid: Rs. ${paymentAmount.toLocaleString()}\nBalance Due: Rs. ${balance.toLocaleString()}`);
  renderPayments();
}

function printReceipt(id) {
  try {
    const receipts = DB.get('receipts') || [];
    const payments = DB.get('payments') || [];
    const customers = DB.get('customers') || [];
    const users = DB.get('users') || [];

    const r = receipts.find(x => x.receipt_id === id);
    if (!r) {
      alert('Receipt not found.');
      return;
    }

    const p = payments.find(x => String(x.payment_id) === String(r.payment_id));
    if (!p) {
      alert('Payment information not found for this receipt.');
      return;
    }

    const c = customers.find(x => String(x.customer_id) === String(r.customer_id));
    if (!c) {
      alert('Customer information not found for this receipt.');
      return;
    }

    if (r.issued_by === undefined || r.issued_by === null || String(r.issued_by).trim() === '') {
      alert('Issued By user information is missing from this receipt.');
      return;
    }

    const u = users.find(x => String(x.user_id) === String(r.issued_by));
    if (!u) {
      alert('The user who issued this receipt was not found.');
      return;
    }

    if (!u.username || !String(u.username).trim()) {
      alert('Receipt issuer username is missing.');
      return;
    }

    if (!r.receipt_code) {
      alert('Receipt number is missing.');
      return;
    }

    const amountPaid = Number(r.amount_paid);
    const balanceDue = Number(r.balance_due || 0);

    if (!Number.isFinite(amountPaid)) {
      alert('Invalid amount paid in this receipt.');
      return;
    }

    const { jsPDF } = window.jspdf;
    if (!jsPDF) {
      alert('PDF library is not loaded. Please check your internet connection and reload the page.');
      return;
    }

    const doc = new jsPDF('p', 'mm', 'a4');

    const ORANGE = [217, 119, 6];
    const DARK = [31, 41, 55];
    const GRAY = [107, 114, 128];
    const LIGHT = [249, 250, 251];
    const BORDER = [229, 231, 235];
    const GREEN = [16, 185, 129];

    // ==============================

    // ==============================
    doc.setFillColor(255, 255, 255);

    doc.text(companyAddress, 105, 27, { align: 'center' });

    doc.setLineWidth(0.8);

    // ==============================
    // TITLE
    // ==============================
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(17);
    doc.setTextColor(...DARK);
    doc.text('PAYMENT RECEIPT', 105, 51, { align: 'center' });

    // ==============================
    // RECEIPT INFORMATION
    // ==============================
    doc.setFillColor(...LIGHT);
    doc.roundedRect(20, 59, 170, 35, 3, 3, 'F');

    const receiptRows = [
      ['Receipt Number', r.receipt_code],
      ['Payment ID', paymentCode],

    ];

    let y = 68;

    receiptRows.forEach(([label, value]) => {

      doc.setTextColor(...DARK);
      doc.text(label + ':', 27, y);

      doc.setFont('helvetica', 'normal');
      doc.setTextColor(0, 0, 0);
      doc.text(String(value), 82, y);

    doc.setFontSize(12);
    doc.setTextColor(...ORANGE);
    doc.text('CUSTOMER INFORMATION', 20, 108);

    doc.setFontSize(10);
    doc.setTextColor(...DARK);
    doc.setFont('helvetica', 'bold');
    doc.text('Customer Name:', 27, 122);

    doc.setFont('helvetica', 'normal');
    doc.text(customerName, 80, 122);

    // ==============================
    // PAYMENT DETAILS

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);

    doc.text('PAYMENT DETAILS', 20, 140);

      ['Issued By:', username]

      doc.setTextColor(...DARK);
      doc.text(label, 27, y);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);

    doc.setFontSize(11);
    doc.setTextColor(...DARK);
    doc.text('Balance Due', 28, 216);

    doc.setFontSize(13);
    doc.setTextColor(...(balanceDue > 0 ? RED : GREEN));
    doc.text(
      'Rs. ' + balanceDue.toLocaleString('en-LK', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }),
      182,
      216,
      { align: 'right' }
    );

    // ==============================
    // STATUS
    // ==============================
    const status = balanceDue > 0 ? 'PARTIALLY PAID' : 'PAID IN FULL';

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...(balanceDue > 0 ? RED : GREEN));
    doc.text(status, 105, 244, { align: 'center' });

    doc.setLineWidth(0.6);

    doc.setFontSize(8);
    doc.setTextColor(...GRAY);
    doc.text('This is a computer-generated payment receipt.', 105, 270, { align: 'center' });
    doc.text(`Generated by: ${username}`, 105, 276, { align: 'center' });

    // ==============================
    // SAVE PDF
    // ==============================
    const safeFileName = String(r.receipt_code)
      .replace(/[^a-zA-Z0-9_-]/g, '_');

    doc.save(`${safeFileName}.pdf`);

  } catch (error) {
    console.error('Receipt PDF Error:', error);
    alert('Unable to generate receipt PDF.\n\n' + error.message);
  }
}

async function generateReport() {

    alert('Please select a valid month and year.');
    return;

  const sales = DB.get('sales').filter(s => {
    const d = new Date(s.sale_date);
    return !isNaN(d.getTime()) && d.getMonth() + 1 === month && d.getFullYear() === year;
  });

  const costs = DB.get('costs').filter(c => {
    const d = new Date(c.cost_date);
    return !isNaN(d.getTime()) && d.getMonth() + 1 === month && d.getFullYear() === year;

    if (reportChartInstance) {
      reportChartInstance.destroy();
      reportChartInstance = null;
    }

    reportChartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [
          {
            label: 'Sales Income',
            data: data.income,
            borderWidth: 3,
            tension: 0.25,
            fill: false,
            pointRadius: 3,
            pointHoverRadius: 6
          },
          {
            label: 'Cost',
            data: data.cost,
            borderWidth: 3,
            tension: 0.25,
            fill: false,
            pointRadius: 3,
            pointHoverRadius: 6
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            position: 'top'
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `${context.dataset.label}: Rs. ${Number(context.raw || 0).toLocaleString('en-LK', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                })}`;
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Date'
            },
            ticks: {
              autoSkip: false,
              maxRotation: 0,
              minRotation: 0
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Total Amount (Rs.)'
            },
            ticks: {
              callback: function(value) {
                return 'Rs. ' + Number(value).toLocaleString('en-LK');
              }
            }
          }
        }
      }
    });
  }, 0);
}

function exportReportPDF(code) {
  const r = DB.get('reports').find(x => x.report_code === code);
  if (!r) { alert('Report not found.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const year = Number(r.report_year);
  const month = Number(r.report_month);
  const monthName = new Date(year, month-1, 1).toLocaleString('en-US',{month:'long'});
  const sales = DB.get('sales').filter(s => { const d=new Date(s.sale_date); return d.getFullYear()===year && d.getMonth()+1===month; });
  const costs = DB.get('costs').filter(c => { const d=new Date(c.cost_date); return d.getFullYear()===year && d.getMonth()+1===month; });
  const days = new Date(year,month,0).getDate();
  const daily=[];
  for(let day=1;day<=days;day++){
    const si=sales.filter(s=>new Date(s.sale_date).getDate()===day).reduce((n,x)=>n+Number(x.total_amount||0),0);
    const co=costs.filter(c=>new Date(c.cost_date).getDate()===day).reduce((n,x)=>n+Number(x.total_price||0),0);
    if(si||co) daily.push([String(day).padStart(2,'0'),si.toFixed(2),co.toFixed(2),(si-co).toFixed(2)]);
  }
  doc.setFontSize(20); doc.setTextColor(217,119,6); doc.text('Seeman Foods',105,18,{align:'center'});
  doc.setFontSize(9); doc.setTextColor(70,70,70); doc.text('195/B Aluboghalanda Pinnawala South, Waga',105,25,{align:'center'}); doc.text('+94 77 754 9425',105,31,{align:'center'});
  doc.setDrawColor(180,180,180); doc.line(20,35,190,35);
  doc.setTextColor(0,0,0); doc.setFontSize(15); doc.setFont(undefined,'bold'); doc.text('Monthly Income Report',105,46,{align:'center'});
  doc.setFontSize(11); doc.text(`${monthName} ${year}`,105,54,{align:'center'}); doc.setFont(undefined,'normal');
  doc.setFontSize(10); let y=68;
  const summary=[['Report Code',r.report_code],['Gross Sales','Rs. '+Number(r.total_gross_sales||0).toLocaleString()],['Service Charges','Rs. '+Number(r.total_service_charges||0).toFixed(2)],['Total Costs','Rs. '+Number(r.total_costs||0).toLocaleString()],['Commissions','Rs. '+Number(r.total_commissions||0).toFixed(2)]];
  summary.forEach(([k,v])=>{doc.setFont(undefined,'bold');doc.text(k+':',25,y);doc.setFont(undefined,'normal');doc.text(String(v),95,y);y+=8;});
  doc.setFillColor(245,245,245); doc.roundedRect(20,y-5,170,18,3,3,'F'); doc.setFont(undefined,'bold'); doc.text('NET PROFIT',30,y+7); doc.text('Rs. '+Number(r.net_profit||0).toLocaleString(),130,y+7); y+=22;
  if(doc.autoTable){ doc.autoTable({startY:y,head:[['Date','Sales Income (Rs.)','Cost (Rs.)','Net (Rs.)']],body:daily.length?daily:[['-','0.00','0.00','0.00']],theme:'grid',styles:{fontSize:9,cellPadding:3},headStyles:{fillColor:[217,119,6]}}); }
  y=(doc.lastAutoTable?.finalY||y+25)+12;
  doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.text('Monthly Totals',20,y); y+=7; doc.setFont(undefined,'normal'); doc.text('Sales Income: Rs. '+Number(r.total_gross_sales||0).toLocaleString(),20,y); doc.text('Costs: Rs. '+Number(r.total_costs||0).toLocaleString(),110,y); y+=8;
  doc.setFontSize(8); doc.setTextColor(110,110,110); doc.text(`Generated by: ${currentUser?.username||'System'}`,20,280); doc.text(new Date().toLocaleString(),190,280,{align:'right'});
  doc.save(`${r.report_code}.pdf`);
}

// ============ UTILITIES ============
function showModal() { document.getElementById('modalOverlay').classList.add('active'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

async function deleteRecord(table, id) {
  const moduleMap = { sales:'Sales', costs:'Costs', customers:'Customers', orders:'Orders', users:'Users', payments:'Payments', receipts:'Receipts' };
  if (!can('D', moduleMap[table])) { alert('Access denied'); return; }
  if (!confirm('Are you sure you want to delete this record?')) return;
  const idField = table === 'sales' ? 'sales_id' : table === 'costs' ? 'cost_id' : table === 'customers' ? 'customer_id' : table === 'orders' ? 'order_id' : table === 'users' ? 'user_id' : table === 'payments' ? 'payment_id' : 'receipt_id';
  const records = DB.get(table);
  const deleted = records.find(r => r[idField] === id);
  DB.set(table, records.filter(r => r[idField] !== id));
  if (googleReady && deleted) {
    const actionMap = { sales:'deleteSale', costs:'deleteCost', customers:'deleteCustomer', orders:'deleteOrder', users:'deleteUser', payments:'deletePayment', receipts:'deleteReceipt' };
    if (actionMap[table]) {
      await apiPost(actionMap[table], { [idField]: id });
      await new Promise(r => setTimeout(r, 500));
      await loadFromGoogleSheets(false);
    }
  }
  navigate(table);
}


// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
